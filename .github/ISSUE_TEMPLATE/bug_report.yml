name: Bug report
description: Something is not working with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please always attach the debug log
        (`custom_components.vssl_mx: debug`).
  - type: input
    id: model
    attributes:
      label: VSSL model and firmware
      placeholder: "MA.1 · 0.0.161.0xff2d7c5"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.2.3"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What did you expect and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      render: shell
